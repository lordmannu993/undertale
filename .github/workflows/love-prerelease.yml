name: Experimental LOVE download

on:
  # Bootstrap publication from this unmerged branch without changing master.
  # Ordinary source pushes do not republish the immutable prerelease.
  push:
    branches: [arena/01a07697-undertale]
    paths: [.github/workflows/love-prerelease.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: love-v0.1.2-experimental-publication
  cancel-in-progress: false

env:
  RELEASE_TAG: love-v0.1.2-experimental
  ASSET_BASE: undertale-love-v0.1.2-experimental

jobs:
  publish:
    if: github.ref == 'refs/heads/arena/01a07697-undertale'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the existing experimental draft
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Never overwrite a published build or silently create a stable release.
          # The tag endpoint omits unpublished drafts. Find the authenticated
          # draft in the release list, then retain its numeric API ID.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\")" > /tmp/release.json
          python3 - <<'PY'
          import json, os
          release = json.load(open('/tmp/release.json'))
          assert release['prerelease'], 'Refusing to modify a non-prerelease'
          publish = release['draft']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('publish=' + str(publish).lower() + '\n')
              output.write('id=' + str(release['id']) + '\n')
          if not publish:
              print('The prerelease is already published; leaving its files unchanged.')
          PY
      - uses: actions/setup-python@v5
        if: steps.release.outputs.publish == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        if: steps.release.outputs.publish == 'true'
        run: python -m pip install -r requirements-dev.txt
      - name: Run all headless and packaging tests
        if: steps.release.outputs.publish == 'true'
        run: python -m pytest -q --junitxml=port-test-output/release-tests.xml
      - name: Build the experimental archive and release notes
        if: steps.release.outputs.publish == 'true'
        run: |
          python tools/package.py --no-convert --output "artifacts/$ASSET_BASE.love"
          python - <<'PY'
          import json, os, xml.etree.ElementTree as ET
          from pathlib import Path
          base = os.environ['ASSET_BASE']
          report = json.loads((Path('artifacts') / (base+'.conversion-report.json')).read_text())
          suites = list(ET.parse('port-test-output/release-tests.xml').getroot().iter('testsuite'))
          assert suites and not report['compile_errors']
          assert sum(int(s.get('failures', '0')) + int(s.get('errors', '0')) for s in suites) == 0
          count = sum(int(s.get('tests', '0')) - int(s.get('skipped', '0')) for s in suites)
          checksum = (Path('artifacts') / (base+'.love.sha256')).read_text().strip()
          notes = Path('docs/RELEASE_NOTES.md').read_text()
          notes += '\n## Build record\n\n'
          notes += f'- Source commit: `{os.environ["GITHUB_SHA"]}` on `arena/01a07697-undertale` (PR #1).\n'
          notes += f'- **{count} automated tests passed** on GitHub Actions.\n'
          notes += f'- **{report["converted_code_units"]:,} source units** translated without parse failures.\n'
          notes += f'- **{len(report["missing_paths"])} missing movement paths**, **{len(report["unresolved_numeric_references"])} unresolved static numeric asset references**, and **{len(report["missing_external_files"])} missing literal external file paths** remain.\n'
          notes += f'- **{len(report.get("missing_rooms", []))} original room is missing**; its ID is preserved rather than compacted.\n'
          notes += '- Native Linux LOVE smoke: packaged archive, touch callbacks, opening backdrop colours, exact SOUL text, glyph bounds and Flowey/border/SOUL pixels, and five screenshots. Android device validation remains outstanding.\n'
          notes += '\n## SHA-256\n\n```text\n' + checksum + '\n```\n'
          Path('build').mkdir(exist_ok=True)
          Path('build/release-notes.md').write_text(notes)
          PY
      - name: Install native LOVE for the rendering release gate
        if: steps.release.outputs.publish == 'true'
        run: sudo apt-get update && sudo apt-get install -y love xvfb xauth
      - name: Validate native graphics before publishing
        if: steps.release.outputs.publish == 'true'
        run: bash tools/native_smoke.sh "artifacts/$ASSET_BASE.love"
      - name: Upload, verify, and publish the prerelease
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'LOVE v0.1.2 — Opening scenery and dialogue fixes (experimental)' \
            --notes-file build/release-notes.md
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "artifacts/$ASSET_BASE.love#LOVE v0.1.2 (experimental)" \
            "artifacts/$ASSET_BASE.love.sha256#SHA-256 checksum" \
            "artifacts/$ASSET_BASE.conversion-report.json#Conversion report and missing resources"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > build/release-assets.json
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          release = json.loads(Path('build/release-assets.json').read_text())
          assert release['draft'] and release['prerelease']
          assets = {a['name']: a for a in release['assets']}
          base = os.environ['ASSET_BASE']
          expected = [base+'.love', base+'.love.sha256', base+'.conversion-report.json']
          assert set(assets) == set(expected), 'Unexpected or missing release assets'
          for name in expected:
              path, asset = Path('artifacts') / name, assets[name]
              assert asset['state'] == 'uploaded' and asset['size'] == path.stat().st_size, name
              if asset.get('digest'):
                  assert asset['digest'] == 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest(), name
          print('Verified all release asset sizes and available server digests.')
          PY
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease --latest=false
      - uses: actions/upload-artifact@v4
        if: always() && steps.release.outputs.publish == 'true'
        with:
          name: native-love-${{ env.RELEASE_TAG }}
          path: port-test-output/
          retention-days: 7
          if-no-files-found: ignore
