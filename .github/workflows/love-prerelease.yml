name: Experimental LOVE download

on:
  # Bootstrap publication from this unmerged branch without changing master.
  # Ordinary source pushes do not republish the immutable prerelease.
  # This workflow file is touched for the v1.2.5 boot-fix bootstrap after its draft exists.
  # Re-run after the catalog-load test stopped reading the suite's real catalog.
  push:
    branches: [arena/01a0d296-undertale]
    paths: [.github/workflows/love-prerelease.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: love-v1.2.5-fusion-experimental-publication
  cancel-in-progress: false

env:
  RELEASE_TAG: love-v1.2.5-fusion-experimental
  ASSET_BASE: undertale-yellow-fusion-v1.2.5-experimental

jobs:
  publish:
    if: github.ref == 'refs/heads/arena/01a0d296-undertale'
    runs-on: ubuntu-latest
    # The merged archive carries ~19,400 pinned Yellow asset files on top of
    # Undertale's, and the native gate plays both worlds; keep the headroom.
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the existing experimental draft
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Never overwrite a published build or silently create a stable release.
          # The tag endpoint omits unpublished drafts. Find the authenticated
          # draft in the release list, then retain its numeric API ID.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\")" > /tmp/release.json
          python3 - <<'PY'
          import json, os
          release = json.load(open('/tmp/release.json'))
          assert release['prerelease'], 'Refusing to modify a non-prerelease'
          publish = release['draft']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('publish=' + str(publish).lower() + '\n')
              output.write('id=' + str(release['id']) + '\n')
          if not publish:
              print('The prerelease is already published; leaving its files unchanged.')
          PY
      - uses: actions/setup-python@v5
        if: steps.release.outputs.publish == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        if: steps.release.outputs.publish == 'true'
        run: python -m pip install -r requirements-dev.txt
      - name: Cache the pinned Undertale Yellow tarball
        if: steps.release.outputs.publish == 'true'
        uses: actions/cache@v4
        with:
          path: .yellow-cache
          key: yellow-${{ hashFiles('port/yellow_source.json') }}
      - name: Fetch the pinned Undertale Yellow decompilation
        if: steps.release.outputs.publish == 'true'
        run: python tools/fetch_yellow.py --tarball-cache .yellow-cache
      - name: Convert Yellow assets, scripts, objects, rooms and paths
        if: steps.release.outputs.publish == 'true'
        run: python tools/yellow_convert.py --stage rooms
      - name: Run all headless and packaging tests
        if: steps.release.outputs.publish == 'true'
        env:
          PORT_REQUIRE_YELLOW: '1'
        run: python -m pytest -q --junitxml=port-test-output/release-tests.xml
      - name: Build the experimental archive and release notes
        if: steps.release.outputs.publish == 'true'
        run: |
          # Yellow's own test fixtures re-run earlier stages against the shared
          # output, leaving the report at the last stage they ran; packaging
          # gates on the rooms stage, so restore it deterministically first.
          python tools/yellow_convert.py --stage rooms
          python tools/package.py --no-convert --merged --output "artifacts/$ASSET_BASE.love"
          python - <<'PY'
          import json, os, shutil, xml.etree.ElementTree as ET
          from pathlib import Path
          base = os.environ['ASSET_BASE']
          report = json.loads((Path('artifacts') / (base+'.conversion-report.json')).read_text())
          yellow = json.loads(Path('generated/yellow/conversion-report.json').read_text())
          suites = list(ET.parse('port-test-output/release-tests.xml').getroot().iter('testsuite'))
          for section in ('scripts', 'objects', 'rooms'):
              assert not (yellow.get(section) or {}).get('compile_errors'), 'Yellow ' + section + ' compile errors'
          assert not report['compile_errors']
          assert sum(int(s.get('failures', '0')) + int(s.get('errors', '0')) for s in suites) == 0
          count = sum(int(s.get('tests', '0')) - int(s.get('skipped', '0')) for s in suites)
          checksum = (Path('artifacts') / (base+'.love.sha256')).read_text().strip()
          notes = Path('docs/RELEASE_NOTES.md').read_text()
          notes += '\n## Build record\n\n'
          notes += f'- Source commit: `{os.environ["GITHUB_SHA"]}` on `{os.environ["GITHUB_REF_NAME"]}` (v1.2.5, Undertale + Undertale Yellow fusion).\n'
          notes += f'- **{count} automated tests passed** on GitHub Actions, the Yellow live gates included.\n'
          notes += f'- Undertale: **{report["converted_code_units"]:,} source units** translated without parse failures; **{len(report["missing_paths"])} missing movement paths**, **{len(report["unresolved_numeric_references"])} unresolved static numeric asset references**, **{len(report["missing_external_files"])} missing literal external file paths** and **{len(report.get("missing_rooms", []))} missing original room** remain.\n'
          notes += f'- Undertale Yellow: **{yellow["rooms"]["converted"]} rooms** and **{yellow["rooms"]["paths"]} paths** with **{yellow["rooms"]["counts"]["drawables"]:,} layer drawables** convert without compile errors; **{len(yellow["rooms"]["unsupported"])} named room-feature stops** (layer effects and physics worlds with no GameMaker 1.4 equivalent) stay blocked rather than rendered without them.\n'
          notes += '- Native Linux LOVE smoke on the merged archive: the Undertale opening (touch navigation, SOUL dialogue, borders, Toriel\'s recovered-path walk) and then the fused-world gates - the X-held boat ride landing one player in rm_hotland_02 drawn as Frisk, snowfall drawn in the Snowdin forest, the UGPS whale returning one Frisk to the Waterfall dock, and a versioned merge.sav recording both crossings and the equipment slots. Android device validation remains outstanding.\n'
          notes += '\n## SHA-256\n\n```text\n' + checksum + '\n```\n'
          Path('build').mkdir(exist_ok=True)
          Path('build/release-notes.md').write_text(notes)
          shutil.copyfile('generated/yellow/conversion-report.json',
                          Path('artifacts') / (base + '.yellow-conversion-report.json'))
          PY
      - name: Install native LOVE for the rendering release gate
        if: steps.release.outputs.publish == 'true'
        run: sudo apt-get update && sudo apt-get install -y love xvfb xauth
      - name: Validate native graphics before publishing
        if: steps.release.outputs.publish == 'true'
        run: bash tools/native_smoke.sh "artifacts/$ASSET_BASE.love"
      - name: Upload, verify, and publish the prerelease
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'LOVE v1.2.5 — Undertale + Undertale Yellow fusion (experimental)' \
            --notes-file build/release-notes.md
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "artifacts/$ASSET_BASE.love#LOVE v1.2.5 fusion (experimental)" \
            "artifacts/$ASSET_BASE.love.sha256#SHA-256 checksum" \
            "artifacts/$ASSET_BASE.conversion-report.json#Undertale conversion report and missing resources" \
            "artifacts/$ASSET_BASE.yellow-conversion-report.json#Undertale Yellow conversion report and named stops"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > build/release-assets.json
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          release = json.loads(Path('build/release-assets.json').read_text())
          assert release['draft'] and release['prerelease']
          assets = {a['name']: a for a in release['assets']}
          base = os.environ['ASSET_BASE']
          expected = [base+'.love', base+'.love.sha256', base+'.conversion-report.json',
                      base+'.yellow-conversion-report.json']
          assert set(assets) == set(expected), 'Unexpected or missing release assets'
          for name in expected:
              path, asset = Path('artifacts') / name, assets[name]
              assert asset['state'] == 'uploaded' and asset['size'] == path.stat().st_size, name
              if asset.get('digest'):
                  assert asset['digest'] == 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest(), name
          print('Verified all release asset sizes and available server digests.')
          PY
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease --latest=false
      - uses: actions/upload-artifact@v4
        if: always() && steps.release.outputs.publish == 'true'
        with:
          name: native-love-${{ env.RELEASE_TAG }}
          path: port-test-output/
          retention-days: 7
          if-no-files-found: ignore
