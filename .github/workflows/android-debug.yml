name: Experimental Android APK (manual)
on:
  workflow_dispatch:
    inputs:
      acknowledge:
        description: 'I can package these assets and understand this is an incomplete experimental port, not a finished game.'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  apk:
    if: ${{ inputs.acknowledge }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install the pinned runner's SDK and NDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;25.2.9519653'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Build an embedded, debug-signed, no-microphone APK
        run: python tools/build_android.py --allow-experimental
      - uses: actions/upload-artifact@v4
        with:
          name: undertale-love-experimental-debug
          path: artifacts/undertale-love-experimental-debug.apk
          if-no-files-found: error
          retention-days: 7
