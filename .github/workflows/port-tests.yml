name: LOVE port tests
on:
  push:
    branches: [arena/01a07697-undertale]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=port-test-output/results.xml
      - name: Install native LOVE and a virtual display
        run: sudo apt-get update && sudo apt-get install -y love xvfb xauth
      - name: Test the packaged game with native graphics and touch callbacks
        run: |
          python tools/package.py --no-convert
          bash tools/native_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: port-test-results
          path: port-test-output/
          retention-days: 7
          if-no-files-found: ignore
