name: LOVE port tests
on:
  push:
    branches: [arena/01a07697-undertale]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    # The Yellow fetch is a 309 MB pinned tarball with 58k files; keep the headroom.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Cache the pinned Undertale Yellow tarball
        uses: actions/cache@v4
        with:
          path: .yellow-cache
          key: yellow-${{ hashFiles('port/yellow_source.json') }}
      - name: Fetch the pinned Undertale Yellow decompilation
        run: python tools/fetch_yellow.py --tarball-cache .yellow-cache
      - name: Convert Yellow assets, scripts, objects, rooms and paths
        run: python tools/yellow_convert.py --stage rooms
      - name: Run the headless suite, Yellow live gates included
        env:
          PORT_REQUIRE_YELLOW: '1'
        run: python -m pytest -q --junitxml=port-test-output/results.xml
      - name: Install native LOVE and a virtual display
        run: sudo apt-get update && sudo apt-get install -y love xvfb xauth
      - name: Test the packaged game with native graphics and touch callbacks
        run: |
          # Yellow's own test fixtures re-run earlier stages against the shared
          # output, leaving the report at the last stage they ran; packaging
          # gates on the rooms stage, so restore it deterministically first.
          python tools/yellow_convert.py --stage rooms
          python tools/package.py --no-convert --merged
          bash tools/native_smoke.sh artifacts/undertale-merged-love-experimental.love
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: port-test-results
          path: port-test-output/
          retention-days: 7
          if-no-files-found: ignore
